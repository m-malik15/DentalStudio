<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dental Studios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow-x: hidden;
            background-color: #f5f5f5;
        }

        .hero-section {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero-image-container {
            width: 100%;
            height: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            border-radius: 8px;
        }

        .content-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
            background-color: #fff;
        }

        .content-section h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 20px;
        }

        .content-section p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .hero-section {
                padding: 15px;
            }

            .hero-image-container {
                max-width: 100%;
            }

            .content-section h1 {
                font-size: 2rem;
            }

            .content-section p {
                font-size: 1rem;
            }

            .content-section {
                padding: 40px 15px;
            }
        }

        @media (max-width: 480px) {
            .hero-section {
                padding: 10px;
            }

            .content-section h1 {
                font-size: 1.75rem;
            }
        }

        /* Landscape mode adjustments */
        @media (orientation: landscape) and (max-height: 600px) {
            .hero-section {
                height: auto;
                min-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-image-container">
            <img src="../images/NewFC_optimized (2).jpeg" 
                 alt="The Dental Studios - Modern Reception Area" 
                 class="hero-image">
        </div>
    </section>

    <!-- Content Section -->
    <section class="content-section">
        <h1>Welcome to The Dental Studios</h1>
        <p>
            Experience modern dental care in a welcoming, state-of-the-art environment. 
            Our practice combines advanced technology with personalized care to ensure 
            your comfort and satisfaction at every visit.
        </p>
    </section>
</body>
</html>
